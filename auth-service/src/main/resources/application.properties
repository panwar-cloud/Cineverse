spring.application.name=auth-service
server.port=8081

# Default active profile (H2 is active by default to run locally out-of-the-box)
spring.profiles.active=h2

# ==========================================
# POSTGRESQL DATABASE CONFIGURATION (Default/Production)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SECURITY & JWT CONFIGURATION
# ==========================================
# HS256 requires a base64-encoded key of at least 256 bits (32 bytes).
# Below is a 256-bit hex/base64 compatible key for local testing.
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token valid for 24 hours (86400000 milliseconds)
application.security.jwt.expiration=86400000
