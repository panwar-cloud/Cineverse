server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
            - id: movie-service
              uri: http://localhost:8082
              predicates:
                - Path=/movies/**, /locations/**, /theatres/**, /screens/**, /seats/**
              filters:
                - name: AuthenticationFilter
            - id: booking-service
              uri: http://localhost:8083
              predicates:
                - Path=/booking/**, /shows/**
              filters:
                - name: AuthenticationFilter

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
